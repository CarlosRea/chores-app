[project]
name = "chores-app"
version = "0.1.0"
description = "Shared household chores management tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "chores_project.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
